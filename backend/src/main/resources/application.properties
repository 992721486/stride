spring.application.name=stride
server.port=8081

# 自动加载本地个人配置（不存在时跳过，不会导致启动失败）
# 该文件被 .gitignore 排除，用于放数据库密码、JWT 密钥等敏感信息
spring.config.import=optional:classpath:application-local.properties

# JWT 密钥：从环境变量 JWT_SECRET 读取，没有则用开发默认值
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-in-production-this-must-be-at-least-32-bytes-long}
jwt.expiration=864000000

# 数据库：全部从环境变量读取，代码里不留任何真实账号密码
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:stride}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
